# /etc/nginx/snippets/botmax-proxy.conf
# Reverse-proxy headers + buffering tuned for Next.js.

# 8 MB max upload — leadform sends a few KB max, but this buffer also covers
# any future file-upload endpoint without nginx truncating.
client_max_body_size 8m;

# Real client IP / proto / host for the Next server (used by api/lead route
# for the X-Forwarded-For chain that the Go backend's rate limiter trusts).
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        $connection_upgrade;

proxy_redirect off;
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_read_timeout 60s;

# Compression. Next already serves Brotli/gzip itself for static; this catches
# dynamic responses (HTML, JSON-LD).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/ld+json
    application/xml
    application/manifest+json
    application/x-font-ttf
    image/svg+xml;
