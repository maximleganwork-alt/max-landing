# /etc/nginx/sites-available/botmax.conf
#
# Reverse-proxies the three frontend subdomains to dockerized Next servers on
# 127.0.0.1:300{1,2,3} and the Go backend on 127.0.0.1:8080 (api subdomain).
# Frontends still talk to the backend over the docker network as
# `http://backend:8080` — the public api.<domain> endpoint exists for external
# clients (and direct curl/health-checks).
#
# Bootstrap order on a fresh server (see DEPLOY.md for full steps):
#   1. Start docker compose so 127.0.0.1:300{1,2,3} and 127.0.0.1:8080 are
#      listening.
#   2. Drop this file in /etc/nginx/sites-available/, symlink to sites-enabled,
#      reload nginx — at first only the :80 blocks work, that's fine.
#   3. Run:  sudo certbot --nginx \
#              -d max.example.ru -d tg.example.ru -d web.example.ru \
#              -d api.example.ru
#      certbot will rewrite the :80 blocks to redirect to :443 and add the
#      :443 server blocks with the right ssl_certificate paths.
#   4. systemctl reload nginx.
#
# Replace `example.ru` with your real apex domain in all 8 server_name lines
# before symlinking.

# ────────────── shared upstream defs ──────────────
# (Single source of truth for the proxy targets; if you ever change ports in
# docker-compose.yml, update them once here.)
upstream botmax_max { server 127.0.0.1:3001; keepalive 16; }
upstream botmax_tg  { server 127.0.0.1:3002; keepalive 16; }
upstream botmax_web { server 127.0.0.1:3003; keepalive 16; }
upstream botmax_api { server 127.0.0.1:8080; keepalive 16; }

# Common proxy headers + Next.js-friendly buffering. Includes via `include` in
# each server block so a typo lives in one place.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ────────────── HTTP — for ACME challenge + redirect ──────────────
# certbot --nginx will rewrite these to permanent 301 → https. Until then they
# serve the app over plain HTTP, which is acceptable for the initial deploy.

server {
    listen 80;
    listen [::]:80;
    server_name max.example.ru;

    # ACME http-01 challenge (certbot writes here).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name tg.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name web.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ────────────── HTTPS — frontend-max ──────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name max.example.ru;

    ssl_certificate     /etc/letsencrypt/live/max.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max.example.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/max.example.ru/chain.pem;

    include /etc/nginx/snippets/botmax-tls.conf;
    include /etc/nginx/snippets/botmax-proxy.conf;

    # Static assets get long cache. Next emits stable hashes so 1y is safe.
    location /_next/static/ {
        proxy_pass http://botmax_max;
        proxy_cache_bypass $http_pragma $http_authorization;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://botmax_max;
    }
}

# ────────────── HTTPS — frontend-tg ──────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tg.example.ru;

    ssl_certificate     /etc/letsencrypt/live/tg.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.example.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tg.example.ru/chain.pem;

    include /etc/nginx/snippets/botmax-tls.conf;
    include /etc/nginx/snippets/botmax-proxy.conf;

    location /_next/static/ {
        proxy_pass http://botmax_tg;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://botmax_tg;
    }
}

# ────────────── HTTPS — frontend-web ──────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.example.ru;

    ssl_certificate     /etc/letsencrypt/live/web.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.example.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/web.example.ru/chain.pem;

    include /etc/nginx/snippets/botmax-tls.conf;
    include /etc/nginx/snippets/botmax-proxy.conf;

    location /_next/static/ {
        proxy_pass http://botmax_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://botmax_web;
    }
}

# ────────────── HTTPS — backend (api.<domain>) ──────────────
# Public surface for the Go lead-service. Frontends keep using
# http://backend:8080 over the docker network; this vhost is for
# external clients and uptime checks.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.ru;

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.example.ru/chain.pem;

    include /etc/nginx/snippets/botmax-tls.conf;
    include /etc/nginx/snippets/botmax-proxy.conf;

    # Backend already enforces CORS off ALLOWED_ORIGINS — no extra header rules
    # needed here. JSON-only API, no static assets.
    location / {
        proxy_pass http://botmax_api;
    }
}
